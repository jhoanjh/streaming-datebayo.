<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estamos Trabajando en Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void-deep: #020204;
    --void-card: rgba(10, 10, 16, 0.7);
    --neon-cyan: #00f3ff;
    --neon-pink: #ff007f;
    --text-main: #ffffff;
    --text-sub: #94a3b8;
    --wa-green: #25d366;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: var(--void-deep);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* ---------- TEXTURA CRT / SCANLINES ---------- */
  body::before {
    content: " ";
    display: block;
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
    z-index: 99;
    background-size: 100% 4px, 6px 100%;
    pointer-events: none;
  }

  /* ---------- RED HOLOGRÁFICA EN MOVIMIENTO (GRID) ---------- */
  .cyber-grid {
    position: fixed; inset: 0;
    background-image: 
      linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    background-position: center;
    transform: perspective(600px) rotateX(65deg) translateY(-150px);
    animation: gridScroll 16s linear infinite;
    opacity: 0.7;
    z-index: 0;
  }
  @keyframes gridScroll {
    0% { background-position: center 0; }
    100% { background-position: center 800px; }
  }

  /* Resplandor central de fondo */
  .ambient-glow {
    position: fixed;
    left: 50%; top: 40%;
    width: 600px; height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,0,127,0.08) 0%, rgba(0,243,255,0.04) 45%, transparent 70%);
    filter: blur(30px);
    z-index: 0;
  }

  /* ---------- NODOS DE DATOS / PARTÍCULAS ---------- */
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .particles span {
    position: absolute;
    border-radius: 50%;
    background: var(--neon-cyan);
    opacity: 0;
    box-shadow: 0 0 8px var(--neon-cyan);
    animation: dataRise linear infinite;
  }
  @keyframes dataRise {
    0% { transform: translateY(120px) scale(0.4); opacity: 0; }
    20% { opacity: 0.7; }
    80% { opacity: 0.4; }
    100% { transform: translateY(-200px) translateX(30px) scale(1.3); opacity: 0; }
  }

  .wrapper {
    width: 100%;
    max-width: 650px;
    padding: 40px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    z-index: 2;
  }

  /* ---------- CONTENEDOR DEL GATITO CON MARCO LÍQUIDO ---------- */
  .illustration-container {
    position: relative;
    width: 100%;
    max-width: 330px;
    padding: 5px; /* Espacio para el neón exterior */
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    border-radius: 28px;
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), 0 0 50px rgba(255, 0, 127, 0.15);
    animation: mainFloat 4s ease-in-out infinite, borderSpectrum 8s linear infinite;
  }

  /* Flotación suave de la tarjeta */
  @keyframes mainFloat {
    0%, 100% { transform: translateY(0) rotate(-0.5deg); }
    50% { transform: translateY(-14px) rotate(0.5deg); }
  }
  /* Cambio cromático continuo del neón */
  @keyframes borderSpectrum {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  /* Temblor frenético interna para simular velocidad de tecleo */
  .cat-gif {
    width: 100%;
    height: auto;
    border-radius: 23px;
    display: block;
    border: 2px solid rgba(0, 0, 0, 0.4);
    animation: franticType 0.1s infinite alternate;
  }
  @keyframes franticType {
    0% { transform: translate(0.5px, 0.5px) scale(1); }
    100% { transform: translate(-0.5px, -0.5px) scale(0.995); }
  }

  /* ---------- TEXTOS NEÓN DIGITAL ---------- */
  h1.title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 7vw, 46px);
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-shadow: 
      0 0 6px #fff,
      0 0 15px var(--neon-cyan),
      0 0 30px var(--neon-pink);
    animation: textPowerOn 1.5s ease-out forwards, textFlicker 7s 1.5s infinite;
  }

  @keyframes textPowerOn {
    0% { opacity: 0; filter: blur(5px); }
    15% { opacity: 0.8; }
    20% { opacity: 0.2; }
    35% { opacity: 1; }
    40% { opacity: 0.4; }
    55% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; }
  }
  @keyframes textFlicker {
    0%, 48%, 50%, 96%, 100% { text-shadow: 0 0 6px #fff, 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-pink); opacity: 1; }
    49%, 97% { text-shadow: 0 0 2px rgba(255,255,255,0.4); opacity: 0.5; }
  }

  p.description {
    font-size: clamp(15px, 4vw, 16.5px);
    line-height: 1.6;
    color: var(--text-sub);
    max-width: 480px;
    margin: 0 auto;
    opacity: 0;
    animation: fadeInNormal 0.8s ease 1s forwards;
  }
  @keyframes fadeInNormal { to { opacity: 1; } }

  /* ---------- TARJETA CYBERPUNK (WHATSAPP) ---------- */
  .whatsapp-card {
    width: 100%;
    max-width: 460px;
    background: var(--void-card);
    border-radius: 24px;
    padding: 30px 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 243, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    animation: textPowerOn 1.2s ease 0.6s forwards;
  }

  .card-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--neon-pink);
    text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
    text-transform: uppercase;
  }

  /* ---------- BOTÓN NEÓN WHATSAPP ---------- */
  .btn-whatsapp {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--wa-green);
    color: #ffffff;
    text-decoration: none;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 16.5px;
    letter-spacing: 0.02em;
    padding: 16px 36px;
    border-radius: 50px;
    width: 100%;
    max-width: 290px;
    box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    overflow: hidden;
    animation: buttonPulse 2.5s infinite;
  }

  /* Destello reflectivo */
  .btn-whatsapp::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: transform 0.6s ease;
  }

  .btn-whatsapp:hover {
    background: #fff;
    color: #128c7e;
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 0 30px rgba(37, 211, 102, 0.8), 0 0 10px #fff;
  }

  .btn-whatsapp:hover::before {
    transform: translateX(200%);
  }

  .btn-whatsapp svg {
    width: 21px;
    height: 21px;
    fill: currentColor;
    transition: transform 0.3s ease;
  }
  .btn-whatsapp:hover svg {
    transform: rotate(-10deg) scale(1.1);
  }

  @keyframes buttonPulse {
    0%, 100% { box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }
    50% { box-shadow: 0 0 25px rgba(37, 211, 102, 0.7), 0 0 40px rgba(0, 243, 255, 0.2); }
  }

  @media (max-width: 480px) {
    .wrapper { padding: 30px 16px; }
    .whatsapp-card { padding: 26px 16px; }
    .btn-whatsapp { width: 100%; }
  }

  /* Modo accesibilidad sin animaciones caóticas */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .title, .whatsapp-card, .description { opacity: 1; }
    .cyber-grid, .particles, body::before { display: none; }
  }
</style>
</head>
<body>

<div class="cyber-grid"></div>
<div class="ambient-glow"></div>
